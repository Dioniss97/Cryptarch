name: PR quality

on:
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Prettier (check)
        working-directory: apps/web
        run: npm run format:check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff format (check)
        run: pip install ruff==0.8.4 && ruff format --check apps/api workers/vectorizer

  lint-frontend:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

  lint-backend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff check
        run: pip install ruff==0.8.4 && ruff check apps/api workers/vectorizer
